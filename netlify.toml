[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# HTTP to HTTPS redirects (MUST come first)
[[redirects]]
  from = "http://professionalresumefree.com/*"
  to = "https://www.professionalresumefree.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.professionalresumefree.com/*"
  to = "https://www.professionalresumefree.com/:splat"
  status = 301
  force = true

# Non-www to www redirect
[[redirects]]
  from = "https://professionalresumefree.com/*"
  to = "https://www.professionalresumefree.com/:splat"
  status = 301
  force = true

# Remove all the sitemap/robots.txt redirects - they're not needed

# SPA redirect for client-side routing (ONLY for 404s)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Status = "404"}