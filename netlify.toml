[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "http://professionalresumefree.com/*"
  to = "https://www.professionalresumefree.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://professionalresumefree.com/*"
  to = "https://www.professionalresumefree.com/:splat"
  status = 301
  force = true

# Sitemap and robots.txt - ensure they are accessible
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/sitemap-0.xml"
  to = "/sitemap-0.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# Catch-all for SPA routing (should be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200